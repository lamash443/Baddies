---
deployment:
  tasks:
    - export DEPLOYPATH=/home/kenyanba/public_html
    - /bin/cp -R /home/kenyanba/repositories/Baddies/public/. $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/storage
    - /bin/cp -R /home/kenyanba/repositories/Baddies/storage/app/public/. $DEPLOYPATH/storage/
    - /bin/chmod -R 775 $DEPLOYPATH/storage
    - /bin/chmod -R 775 /home/kenyanba/repositories/Baddies/storage
    - /bin/chmod -R 775 /home/kenyanba/repositories/Baddies/bootstrap/cache