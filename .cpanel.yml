---
deployment:
  tasks:
    - /bin/echo "=== Step 1: Copy public files to web root ==="
    - /bin/cp -R /home/kenyanba/repositories/Baddies/public/. /home/kenyanba/public_html/

    - /bin/echo "=== Step 2: Fix storage symlink for images ==="
    - /bin/rm -rf /home/kenyanba/public_html/storage
    - /bin/ln -sfn /home/kenyanba/repositories/Baddies/storage/app/public /home/kenyanba/public_html/storage


    - /bin/echo "=== Step 4: Set directory permissions ==="
    - /bin/chmod -R 775 /home/kenyanba/repositories/Baddies/storage
    - /bin/chmod -R 775 /home/kenyanba/repositories/Baddies/bootstrap/cache

    - /bin/echo "=== Step 5: Clear all Laravel caches (using lsphp) ==="
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan config:clear
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan cache:clear
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan route:clear
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan view:clear

    - /bin/echo "=== Step 6: Run database migrations ==="
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan migrate --force

    - /bin/echo "=== Step 7: Rebuild production caches ==="
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan config:cache
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan route:cache
    - /usr/local/bin/lsphp /home/kenyanba/repositories/Baddies/artisan view:cache

    - /bin/echo "=== Deployment complete ==="